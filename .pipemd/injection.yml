# PipeMD Injection Configuration
#
# delivery: passive | active | expert
#   passive = render to file/pipe, no hooks
#   active  = hooks installed, sensible defaults
#   expert  = full customization of injection rules
#
# triggers: before-read | before-edit | after-edit | on-idle | on-start
# sources:  crew-status | crew-locks | file-errors | file-content
#           git-context | git-delta | git-staged | git-diff-stat
#           edit-diff | syntax-check | test-failures | custom
#           import-graph | handoff | session-diff | exports | now
# scope:    target-file | global
# interval-min: (now source only) minutes to round time to, controlling refresh frequency
delivery: active
rules:
  before-read:
    - source: crew-status
      scope: global
      max-lines: 3
  before-edit:
    - source: crew-locks
      scope: target-file
    - source: file-errors
      scope: target-file
      max-lines: 5
    - source: git-context
      scope: target-file
      max-lines: 2
    - source: import-graph
      scope: target-file
      max-lines: 25
    - source: exports
      scope: target-file
      max-lines: 15
    - source: syntax-check
      scope: target-file
      max-lines: 5
  on-start:
    - source: test-failures
      scope: global
      max-lines: 15
    - source: handoff
      scope: global
      max-lines: 30
    - source: now
      scope: global
      interval-min: 1
  on-idle:
    - source: now
      scope: global
      interval-min: 5
  after-edit:
    - source: edit-diff
      scope: target-file
      max-lines: 20
      async: true
    - source: syntax-check
      scope: target-file
      max-lines: 5
      async: true
    - source: file-errors
      scope: target-file
      max-lines: 15
      async: true
