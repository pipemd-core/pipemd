version: "1.0"
delivery: active
commands:
  arch: PMD_TOKEN_PROFILE=high PMD_ECOSYSTEM=Node-TypeScript bash
    .pipemd/scripts/architecture/arch.sh
  tree: PMD_TOKEN_PROFILE=high PMD_ECOSYSTEM=Node-TypeScript bash
    .pipemd/scripts/project/tree.sh
  deps: PMD_TOKEN_PROFILE=high PMD_ECOSYSTEM=Node-TypeScript bash
    .pipemd/scripts/project/deps.sh
  todos: PMD_TOKEN_PROFILE=high PMD_ECOSYSTEM=Node-TypeScript bash
    .pipemd/scripts/project/find-todos.sh
  git-log: PMD_TOKEN_PROFILE=high PMD_ECOSYSTEM=Node-TypeScript bash
    .pipemd/scripts/git/git-log.sh
  git-branch: PMD_TOKEN_PROFILE=high PMD_ECOSYSTEM=Node-TypeScript bash
    .pipemd/scripts/git/git-branch.sh
  git-status: PMD_TOKEN_PROFILE=high PMD_ECOSYSTEM=Node-TypeScript bash
    .pipemd/scripts/git/git-status.sh
  diff-stat: PMD_TOKEN_PROFILE=high PMD_ECOSYSTEM=Node-TypeScript bash
    .pipemd/scripts/git/diff-stat.sh
  type-check: PMD_TOKEN_PROFILE=high PMD_ECOSYSTEM=Node-TypeScript bash
    .pipemd/scripts/quality/type-check.sh
  lint: PMD_TOKEN_PROFILE=high PMD_ECOSYSTEM=Node-TypeScript bash
    .pipemd/scripts/quality/lint.sh
  crew: PMD_TOKEN_PROFILE=high PMD_ECOSYSTEM=Node-TypeScript bash
    .pipemd/scripts/crew/crew.sh
  test-summary: PMD_TOKEN_PROFILE=high PMD_ECOSYSTEM=Node-TypeScript bash
    .pipemd/scripts/quality/test-summary.sh
injected:
  - file: .pipemd/template.md
    watch: true
pipes:
  - file: CLAUDE.md
    render: .pipemd/template.md
    mode: pipe
  - file: AGENTS.md
    render: .pipemd/template.md
    mode: pipe
  - file: arch.md
    command: arch
  - file: tree.md
    command: tree
  - file: deps.md
    command: deps
  - file: todos.md
    command: todos
  - file: git-log.md
    command: git-log
  - file: git-branch.md
    command: git-branch
  - file: git-status.md
    command: git-status
  - file: diff-stat.md
    command: diff-stat
  - file: type-check.md
    command: type-check
  - file: lint.md
    command: lint
  - file: crew.md
    command: crew
  - file: test-summary.md
    command: test-summary
settings:
  debounceMs: 3000
  reServeDelayMs: 1000
  tokenProfile: high
